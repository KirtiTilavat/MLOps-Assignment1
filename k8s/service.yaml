apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
  namespace: heart-disease
  labels:
    app: heart-disease-api
spec:
  type: LoadBalancer   # Docker Desktop maps this to http://localhost:<port>
  selector:
    app: heart-disease-api
  ports:
    - name: http
      port: 80
      targetPort: http
