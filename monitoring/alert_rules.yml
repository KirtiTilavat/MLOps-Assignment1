groups:
  - name: heart-disease-api
    rules:
      - alert: ApiDown
        expr: up{job="heart-disease-api"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: Prediction API is not responding to scrapes

      - alert: HighErrorRate
        expr: |
          sum(rate(heart_api_requests_total{status=~"5.."}[2m]))
            / clamp_min(sum(rate(heart_api_requests_total[2m])), 1e-9) > 0.05
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: More than 5% of requests are failing with 5xx

      - alert: SlowPredictions
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(heart_api_request_duration_seconds_bucket{path="/predict"}[2m]))) > 0.5
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: p95 /predict latency above 500 ms
